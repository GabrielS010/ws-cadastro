<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Cadastro - Rastreio</title>
    <link rel="stylesheet" href="estilo.css">
</head>
<body>
    <div class="container-auth">
        <h2>Criar Conta</h2>
        <form onsubmit="cadastrarUsuario(event)">
            <label>Nome Completo:</label>
            <input type="text" id="nome" required>
            <label>E-mail:</label>
            <input type="email" id="email" required>
            <label>Senha:</label>
            <input type="password" id="senha" required>
            <label>Confirmar Senha:</label>
            <input type="password" id="confirma" required>
            
            <button type="submit">Finalizar Cadastro</button>
            <a href="index.html" style="text-align: center; color: var(--cor-primaria); margin-top: 10px;">Voltar ao Login</a>
        </form>
    </div>
    <script src="app.js"></script>
</body>
</html>
