<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Cadastrar Produto</title>
    <link rel="stylesheet" href="estilo.css">
</head>
<body>
    <div class="container-auth" style="max-width: 500px; margin-top: 80px;">
        <h2>Cadastrar Novo Produto</h2>
        <form onsubmit="cadastrarProduto(event)">
            <label>Código do RFID:</label>
            <input type="text" id="rfid" required>
            
            <label>Nome do Produto:</label>
            <input type="text" id="nomeProd" required>
            
            <label>Preço Sugerido (R$):</label>
            <input type="number" id="preco" step="0.01" required>
            
            <button type="submit">Salvar Produto</button>
            <a href="principal.html" style="text-align: center; color: var(--cor-primaria); margin-top: 10px;">Cancelar e voltar</a>
        </form>
    </div>
    <script src="app.js"></script>
</body>
</html>
