<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Cadastro de novos usuários no Sistema RFID.">
  <title>Novo Usuário - Sistema RFID</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Criar Conta</h1>
  </header>

  <main>
    <form id="form-registro">
      <fieldset>
        <legend>Cadastro de Usuário</legend>

        <div class="input-group">
          <label for="nome-usuario">Nome Completo</label>
          <input type="text" id="nome-usuario" name="nome-usuario" placeholder="Ex: João Santos" required>
        </div>

        <div class="input-group">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" placeholder="Ex: joao@email.com" required>
        </div>

        <div class="input-group">
          <label for="senha-nova">Senha</label>
          <input type="password" id="senha-nova" name="senha-nova" placeholder="Crie uma senha forte" required>
        </div>

        <button type="submit">Registrar</button>
      </fieldset>
    </form>
  </main>

  <footer>
    <p>Já tem conta? <a href="login.html">Faça o Login</a></p>
  </footer>

  <!-- Script para simular o redirecionamento após o registro -->
  <script>
    document.getElementById('form-registro').addEventListener('submit', function(e) {
      e.preventDefault(); 
      alert("Conta criada com sucesso! Faça login para continuar.");
      window.location.href = 'login.html'; // Manda pro login depois de registrar
    });
  </script>
</body>
</html>
